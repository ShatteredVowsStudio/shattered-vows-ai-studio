<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shattered Vows AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 32px 20px 22px;
      background: linear-gradient(180deg, #19141c, #08090c);
    }

    .brand {
      font-size: 12px;
      letter-spacing: 3px;
      color: #c9a66b;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 29px;
    }

    .subtitle {
      color: #92959d;
      font-size: 14px;
    }

    main {
      padding: 16px;
    }

    .section-title {
      margin: 18px 4px 12px;
      font-size: 13px;
      color: #8e9199;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .character {
      padding: 18px;
      border: 1px solid #2a2c33;
      border-radius: 18px;
      background: #12141a;
      margin-bottom: 18px;
    }

    .character h2 {
      margin: 0 0 5px;
    }

    .locked {
      color: #c9a66b;
      font-size: 13px;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 72px;
      border: 1px solid #2c2f37;
      border-radius: 16px;
      background: #15171d;
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    button:active {
      background: #242730;
    }

    .generate {
      width: 100%;
      margin-top: 18px;
      min-height: 58px;
      background: #b08a50;
      color: #08090c;
      border: none;
      font-size: 16px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #60636b;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">SHATTERED VOWS</div>
  <h1>AI Studio</h1>
  <div class="subtitle">Private AI Filmmaking Workspace</div>
</header>

<main>

  <div class="section-title">Character Library</div>

  <div class="character">
    <h2>Ariana</h2>
    <div class="locked">🔒 Character Identity Locked</div>
  </div>

  <div class="section-title">Production Studio</div>

  <div class="tools">
    <button>🎭 Characters</button>
    <button>🎬 Scenes</button>
    <button>🎥 Image → Video</button>
    <button>🗣️ Voice & Lip Sync</button>
    <button>🌐 Subtitles</button>
    <button>✂️ Editor</button>
    <button>✨ Effects</button>
    <button>📦 Exports</button>
  </div>

  <button class="generate">GENERATE SCENE</button>

</main>

<footer>
  Shattered Vows AI Studio • Private Production System
</footer>

</body>
</html>
